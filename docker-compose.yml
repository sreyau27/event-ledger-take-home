version: '3.8'

services:
  account-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn account_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1

  event-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn event_gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - ACCOUNT_SERVICE_URL=http://account-service:8001
      - PYTHONUNBUFFERED=1
    depends_on:
      - account-service
